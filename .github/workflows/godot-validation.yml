name: Vérification Godot 3D

on:
  push:
    branches: [main]
    paths:
      - "game/**"
      - ".github/workflows/godot-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  godot-validation:
    name: Import et démarrage Godot 4.6.3
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.3
          use-dotnet: false
          include-templates: false

      - name: Vérifier la version
        run: godot --version

      - name: Importer les scripts et scènes
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path game --editor --import --quit 2>&1 | tee godot-import.log
          if grep -E 'SCRIPT ERROR|Parser Error|Parse Error' godot-import.log; then exit 1; fi

      - name: Tester le gameplay (vagues, héros, fumée, coffre)
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path game --script res://tests/smoke.gd 2>&1 | tee godot-smoke.log
          if grep -E 'SCRIPT ERROR|Parser Error|Parse Error|FAIL:' godot-smoke.log; then exit 1; fi

      - name: Lancer brièvement la scène principale
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path game --quit-after 5 2>&1 | tee godot-runtime.log
          if grep -E 'SCRIPT ERROR|Parser Error|Parse Error' godot-runtime.log; then exit 1; fi

  windows-build:
    name: Compiler l'aperçu Windows
    needs: godot-validation
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.3
          use-dotnet: false
          include-templates: true
      - name: Exporter le jeu Windows
        shell: bash
        run: |
          mkdir -p dist
          godot --headless --path game --editor --import --quit
          godot --headless --path game --export-release "Windows Desktop" ../dist/ShurikenSchool3D.exe
          ls -lah dist
          test -s dist/ShurikenSchool3D.exe
      - name: Publier l'EXE et les données du jeu
        uses: actions/upload-artifact@v4
        with:
          name: ShurikenSchool3D-Windows
          path: dist/*
          retention-days: 30

  render-preview:
    name: Capturer un aperçu visuel Godot
    needs: godot-validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.3
          use-dotnet: false
          include-templates: false
      - name: Moteur logiciel graphique
        run: sudo apt-get update -qq && sudo apt-get install -y xvfb libgl1-mesa-dri
      - name: Générer un screenshot depuis la scène réelle
        run: |
          godot --headless --path game --editor --import --quit
          xvfb-run -a -s '-screen 0 1280x720x24' env LIBGL_ALWAYS_SOFTWARE=1 godot --path game --rendering-driver opengl3 --script res://tests/capture.gd
          test -s game/preview.png
      - name: Publier l'aperçu PNG
        uses: actions/upload-artifact@v4
        with:
          name: ShurikenSchool3D-Apercu
          path: game/preview.png
          retention-days: 30

  android-debug:
    name: Compiler un APK Android de test
    needs: godot-validation
    runs-on: ubuntu-latest
    timeout-minutes: 35
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Utiliser le SDK Android présent sur le runner
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -f "$ANDROID_HOME/platform-tools/adb"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.3
          use-dotnet: false
          include-templates: true
      - name: Configurer SDK Android / Java pour Godot
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        shell: bash
        run: |
          keytool -genkeypair -keystore "$GITHUB_WORKSPACE/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Shuriken Debug,OU=Game,O=Elikto,C=FR"
          godot --headless --editor --path game --script res://tests/configure_android.gd
          godot --headless --path game --editor --import --quit
      - name: Exporter APK signé pour tests (non destiné au Play Store)
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        shell: bash
        run: |
          mkdir -p dist
          godot --headless --path game --export-debug "Android" ../dist/ShurikenSchool3D-debug.apk
          test -s dist/ShurikenSchool3D-debug.apk
      - name: Publier l'APK de test
        uses: actions/upload-artifact@v4
        with:
          name: ShurikenSchool3D-Android-Debug
          path: dist/*.apk
          retention-days: 30
